# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches:
      - '**'
  pull_request:

env:
  MAVEN_ARGS: '-B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Debug GitHub variables
        run: |
          echo "GITHUB_EVENT_NAME: ${GITHUB_EVENT_NAME}"
          echo "GITHUB_HEAD_REPOSITORY: ${GITHUB_HEAD_REPOSITORY}"
          echo "GITHUB_HEAD_REF: ${GITHUB_HEAD_REF}"
          echo "GITHUB_REPOSITORY: ${GITHUB_REPOSITORY}"
          echo "GITHUB_REF: ${GITHUB_REF}"
          echo "GITHUB_ACTOR: ${GITHUB_ACTOR}"

      - name: Determine PR source branch and fork repository
        id: vars
        run: |
          # Skip tag pushes entirely
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" != refs/heads/* ]]; then
            echo "Not a branch push ($GITHUB_REF). Exiting."
            exit 0
          fi

          # Set default FORK_REPO and BRANCH_NAME values.
          BRANCH_NAME="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"

          # Extract repository owner (e.g. "uni2growcm", "informatici")
          REPO_OWNER="${GITHUB_REPOSITORY_OWNER:-${GITHUB_REPOSITORY%%/*}}"

          # Determine the Core repository to checkout:
          ORG_CORE_REPO="${REPO_OWNER}/openhospital-core"
          CHECK_ORG_URL="https://github.com/${ORG_CORE_REPO}/tree/${BRANCH_NAME}"
          echo "Checking branch existence in organization ($CHECK_ORG_URL)"

          if curl -s -o /dev/null -w "%{http_code}" "$CHECK_ORG_URL" | grep -q "200"; then
            FORK_REPO="$ORG_CORE_REPO"
            echo "Branch $BRANCH_NAME found in organization repository: $FORK_REPO"
          elif [[ -n "$GITHUB_ACTOR" ]] && curl -s -o /dev/null -w "%{http_code}" "https://github.com/${GITHUB_ACTOR}/openhospital-core/tree/${BRANCH_NAME}" | grep -q "200"; then
            FORK_REPO="${GITHUB_ACTOR}/openhospital-core"
            echo "Branch $BRANCH_NAME found in actor repository: $FORK_REPO"
          else
            FORK_REPO="informatici/openhospital-core"
            echo "Branch $BRANCH_NAME not found in forks. Fallback to: $FORK_REPO"
          fi
          
          # Export FORK_REPO and BRANCH_NAME to GITHUB_ENV for the next step
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          echo "FORK_REPO=$FORK_REPO" >> $GITHUB_ENV

      - name: Log variables
        run: |
          echo "FORK_REPO: ${{ env.FORK_REPO }}"
          echo "BRANCH_NAME: ${{ env.BRANCH_NAME }}"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          java-package: jdk

      - name: Checkout core
        run: |
          git clone --depth=1 --no-single-branch https://github.com/${{ env.FORK_REPO }}.git openhospital-core
          pushd openhospital-core
          git checkout -B ${{ env.BRANCH_NAME }} origin/${{ env.BRANCH_NAME }} || git checkout develop
          popd
        
      - name: Install core
        run: |
          pushd openhospital-core
          mvn install -DskipTests=true
          popd

      - name: Build with Maven
        run: mvn install
